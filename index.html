<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VulnShop - Login</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 8px; }
        .error { color: red; margin-top: 10px; border: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>
    <h2>VulnShop Login</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        <button type="submit">Login</button>
    </form>
    
    

    <script>
        // VULNERABLE: open redirect via 'next' parameter
        const urlParams = new URLSearchParams(window.location.search);
        let redirectTarget = urlParams.get('next');

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');

            // Hardcoded check (no backend)
            if (username === 'admin' && password === 'admin123') {
                // VULNERABLE: unsanitized redirect – can lead to javascript: or arbitrary URL
                if (redirectTarget) {
                    window.location.href = redirectTarget;   // open redirect / javascript:alert('hi')
                } else {
                    window.location.href = 'home.html';
                }
            } else {
                // VULNERABLE: direct injection of user input into innerHTML
                errorDiv.innerHTML = '❌ Invalid login for: ' + username;
            }
        });
    </script>
</body>
</html>
