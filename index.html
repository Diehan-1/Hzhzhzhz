<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VulnShop - Login</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 8px; }
        .error { color: red; margin-top: 10px; border: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>
    <h2>VulnShop Login</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        <button type="submit">Login</button>
    </form>
    
    <div id="errorMsg"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let redirectTarget = urlParams.get('next');

        // পাসওয়ার্ড এনকোডেড (seclist এর প্রথম দিকের একটি কমন পাসওয়ার্ড)
        // কোনো UI তে শো করে না, সোর্স কোড দেখলেও সরাসরি বোঝা যাবে না
        const _0x9f3k = [0x1d, 0x1c, 0x17, 0x1d, 0x1a, 0x10, 0x1d, 0x0c];
        let _hidden = '';
        for (let i = 0; i < _0x9f3k.length; i++) {
            _hidden += String.fromCharCode(_0x9f3k[i] ^ 0x6c);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            let errorDiv = document.getElementById('errorMsg');

            if (username === 'admin' && password === _hidden) {
                if (redirectTarget) {
                    window.location.href = redirectTarget;
                } else {
                    window.location.href = 'home.html';
                }
            } else {
                errorDiv.innerHTML = '❌ Invalid login for: ' + username;
            }
        });
    </script>
</body>
</html>
